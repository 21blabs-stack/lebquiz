<html lang="fr">
<head><style>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B QUIZ - Bon pour ton Brain</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
body{background:#fff;color:#0A0A0A}
button{cursor:pointer;border:0}
.canvas-hide{position:absolute;left:-9999px;top:-9999px}
</style>

<body>
<div id="root"></div>
<script type="module">
import React from 'https://esm.sh/react@18.2.0';
import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';

const QUESTIONS = [
{cat:"Monde",q:"Quelle est la plus grande océan du monde ?",options:["Atlantique","Pacifique","Indien","Arctique"],correctIndex:1},
{cat:"Vie",q:"Combien de dents possède un adulte ?",options:["28","30","32","34"],correctIndex:2},
{cat:"Temps",q:"Combien de jours compte une année bissextile ?",options:["365 jours","366 jours","364 jours","360 jours"],correctIndex:1}
];

function App(){
const [screen,setScreen]=React.useState('home');
const [qIndex,setQIndex]=React.useState(0);
const [answers,setAnswers]=React.useState([]);
const [selected,setSelected]=React.useState(null);
const [blocked,setBlocked]=React.useState({blocked:false,hours:0});
const [dataUrl,setDataUrl]=React.useState(null);
const [blob,setBlob]=React.useState(null);
const [generating,setGenerating]=React.useState(false);
const canvasRef=React.useRef(null);

React.useEffect(()=>{
const last=localStorage.getItem('b_quiz_last_done');
if(last){
const diff=Date.now()-parseInt(last,10);
if(diff<86400000){
const h=Math.ceil((86400000-diff)/3600000);
setBlocked({blocked:true,hours:h});
}
}
},[]);

const score=answers.filter((a,i)=>a===QUESTIONS[i].correctIndex).length;

const startQuiz=()=>{
if(blocked.blocked) return;
setAnswers([]);setQIndex(0);setSelected(null);setScreen('quiz');
};

const pick=(idx)=>{
if(selected!==null) return;
setSelected(idx);
const newAns=[...answers]; newAns[qIndex]=idx;
setTimeout(()=>{
setAnswers(newAns);
if(qIndex<QUESTIONS.length-1){setQIndex(v=>v+1);setSelected(null);}
else{
localStorage.setItem('b_quiz_last_done',Date.now().toString());
setScreen('result');
setSelected(null);
}
},380);
};

const roundRect=(ctx,x,y,w,h,r)=>{
ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
};

const generateImage=async()=>{
const canvas=canvasRef.current;
const ctx=canvas.getContext('2d');
canvas.width=1080;canvas.height=1920;
ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,1080,1920);

// soft purple blobs like in design
ctx.fillStyle='#F5F0FF';
ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(400,100,600,50,1080,250);ctx.lineTo(1080,0);ctx.closePath();ctx.fill();
ctx.beginPath();ctx.moveTo(200,300);ctx.bezierCurveTo(500,200,800,400,900,800);ctx.bezierCurveTo(850,1000,600,1300,550,1450);ctx.bezierCurveTo(500,1200,300,600,200,300);ctx.closePath();ctx.fill();

// LOGO B QUIZ - toujours dessiné en texte, pas d'image externe (fiable à 100%)
let y=140;
ctx.fillStyle='#0A0A0A';
ctx.font='900 96px Inter, system-ui, sans-serif';
ctx.textAlign='center';
ctx.fillText('B QUIZ',540,y);
y+=40;
// petite ligne sous logo
ctx.fillStyle='#7C3AED';
ctx.font='600 28px Inter';
ctx.fillText('—',540,y);
y+=70;

// Pill Bon pour ton Brain
const pillText='Bon pour ton Brain';
ctx.font='600 28px Inter';
const tm=ctx.measureText(pillText);
const pillW=tm.width+56+24;
const pillH=58;
const pillX=(1080-pillW)/2;
roundRect(ctx,pillX,y,pillW,pillH,999);
ctx.fillStyle='#F5F0FF';ctx.fill();
ctx.fillStyle='#7C3AED';
ctx.beginPath();ctx.arc(pillX+28,y+pillH/2,8,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#7C3AED';ctx.textAlign='left';ctx.fillText(pillText,pillX+28+18,y+pillH/2+10);
y+=pillH+80;

// Score
ctx.fillStyle='#0A0A0A';
ctx.font='800 320px Inter, system-ui, sans-serif';
ctx.textAlign='center';
ctx.fillText(`${score}/3`,540,y+260);
y+=350;
let msg='Bien joué !';
if(score===3) msg='Parfait !'; else if(score===2) msg='Bien joué !'; else if(score===1) msg='On continue ?'; else msg='À refaire demain !';
ctx.fillStyle='#6B7280';ctx.font='500 36px Inter';ctx.fillText(msg,540,y);
y+=80;

// 3 lignes catégories
const cardW=840, cardH=96, cardX=(1080-cardW)/2, gap=18;
for(let i=0;i<QUESTIONS.length;i++){
const ok=answers[i]===QUESTIONS[i].correctIndex;
roundRect(ctx,cardX,y,cardW,cardH,18);
ctx.fillStyle='#F9FAFB';ctx.fill();
ctx.strokeStyle='#F3F4F6';ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle='#0A0A0A';ctx.font='600 30px Inter';ctx.textAlign='left';ctx.fillText(QUESTIONS[i].cat,cardX+28,y+cardH/2+11);
const cx=cardX+cardW-36, cy=y+cardH/2;
ctx.fillStyle=ok?'#22C55E':'#EF4444';
ctx.beginPath();ctx.arc(cx,cy,22,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#FFF';ctx.font=ok?'700 26px Inter':'700 22px Inter';ctx.textAlign='center';
ctx.fillText(ok?'✓':'✕',cx,cy+(ok?9:8));
y+=cardH+gap;
}
y+=80;
// brain emoji faint
ctx.globalAlpha=0.14;
ctx.font='140px Inter';ctx.textAlign='center';ctx.fillText('🧠',540,1920-260);
ctx.globalAlpha=1;
ctx.fillStyle='#9CA3AF';ctx.font='500 24px Inter';ctx.textAlign='center';
ctx.fillText('Bon pour ton Brain  —  B QUIZ',540,1848);

const blobRes=await new Promise(r=>canvas.toBlob(b=>r(b),'image/png',1));
const dataUrlRes=canvas.toDataURL('image/png');
return {blob:blobRes,dataUrl:dataUrlRes};
};

const onDownloadAndShare=async()=>{
if(generating) return;
setGenerating(true);
try{
const {blob:b,dataUrl:u}=await generateImage();
setBlob(b);setDataUrl(u);
// essaie le partage natif (iPhone)
const file=new File([b],`b-quiz-${score}-sur-3.png`,{type:'image/png'});
if(navigator.canShare && navigator.canShare({files:[file]})){
try{
await navigator.share({files:[file],title:`B QUIZ ${score}/3`,text:`J'ai fait ${score}/3 au B QUIZ !`});
setScreen('preview');setGenerating(false);return;
}catch(e){if(e?.name==='AbortError'){setScreen('preview');setGenerating(false);return;}}
}
// sinon download + preview
const a=document.createElement('a');a.href=u;a.download=`b-quiz-${score}-sur-3.png`;document.body.appendChild(a);a.click();a.remove();
setScreen('preview');
}catch(e){console.error(e);alert('Erreur génération: '+e.message);}finally{setGenerating(false);}
};

const shareToInsta=async()=>{
if(!blob || !dataUrl) return;
// Re-tente le partage de fichier (c'est la seule façon qui marche vraiment pour Story)
if(navigator.canShare){
try{
const file=new File([blob],`b-quiz-${score}-sur-3.png`,{type:'image/png'});
if(navigator.canShare({files:[file]})){
await navigator.share({files:[file],title:'B QUIZ'});
return;
}
}catch(e){console.log(e);}
}
// Fallback: ouvre Instagram
window.location.href='instagram://story-camera';
setTimeout(()=>{
if(document.visibilityState==='visible'){
window.open('https://www.instagram.com/','_blank');
}
},800);
};

return React.createElement('div',{style:{background:'#fff',minHeight:'100vh',display:'flex',justifyContent:'center'}},
React.createElement('div',{style:{width:'100%',maxWidth:480,minHeight:'100vh',display:'flex',flexDirection:'column',padding:'32px 24px',position:'relative'}},
screen==='home' && React.createElement('div',{style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',textAlign:'center'}},
React.createElement('div',{style:{fontWeight:900,fontSize:48,letterSpacing:-1,marginBottom:24}},'B QUIZ'),
React.createElement('p',{style:{textTransform:'uppercase',letterSpacing:'0.2em',fontSize:14,color:'#6B7280',marginBottom:20}},'le quiz du jour'),
React.createElement('div',{style:{display:'inline-flex',alignItems:'center',gap:10,padding:'8px 16px',borderRadius:999,background:'#F5F0FF',color:'#7C3AED',fontSize:13,fontWeight:600,marginBottom:40}},
React.createElement('span',{style:{width:8,height:8,borderRadius:999,background:'#7C3AED',display:'inline-block'}}),'','Bon pour ton Brain'),
React.createElement('h1',{style:{fontSize:28,fontWeight:600,lineHeight:1.2,maxWidth:320,marginBottom:40}},'3 questions par jour',React.createElement('br'),'60 secondes',React.createElement('br'),"C'est tout."),
blocked.blocked ? React.createElement('div',{style:{width:'100%'}},
React.createElement('div',{style:{background:'#F9FAFB',border:'1px solid #F3F4F6',borderRadius:14,padding:16,marginBottom:16}},
React.createElement('p',{style:{fontSize:14,color:'#6B7280'}},'Tu as déjà joué aujourd’hui'),
React.createElement('p',{style:{fontSize:16,fontWeight:600,marginTop:4}},`Reviens dans ${blocked.hours}h`)
),
React.createElement('button',{disabled:true,style:{width:'100%',height:52,borderRadius:14,background:'#E5E7EB',color:'#9CA3AF',fontWeight:600}},'Bloqué 24h')
) : React.createElement('button',{onClick:startQuiz,style:{width:'100%',height:52,borderRadius:14,background:'#0A0A0A',color:'#fff',fontWeight:600,fontSize:16}},'Commencer le quiz'),
React.createElement('p',{style:{fontSize:12,color:'#9CA3AF',marginTop:24}},'100% autonome · Sans pub · Vanilla')
),
screen==='quiz' && React.createElement('div',{style:{flex:1,display:'flex',flexDirection:'column'}},
React.createElement('div',{style:{display:'flex',justifyContent:'center',gap:8,paddingTop:16,paddingBottom:32}},
QUESTIONS.map((_,i)=>React.createElement('div',{key:i,style:{height:6,width:32,borderRadius:999,background:i<=qIndex?'#0A0A0A':'#F3F4F6'}}))
),
React.createElement('span',{style:{display:'inline-flex',padding:'4px 12px',borderRadius:999,background:'#F9FAFB',border:'1px solid #F3F4F6',fontSize:12,fontWeight:600,textTransform:'uppercase',color:'#6B7280',marginBottom:12}},QUESTIONS[qIndex].cat),
React.createElement('h2',{style:{fontSize:22,fontWeight:600,lineHeight:1.25,marginBottom:32,minHeight:56}},QUESTIONS[qIndex].q),
React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:12}},
QUESTIONS[qIndex].options.map((opt,idx)=>{
const isSel=selected===idx;
const isCorrect=idx===QUESTIONS[qIndex].correctIndex;
const showResult=selected!==null;
let border='#F3F4F6', bg='#fff';
if(showResult){if(isSel) {border=isCorrect?'#22C55E':'#EF4444'; bg=isCorrect?'#F0FDF4':'#FEF2F2';} else if(isCorrect){border='#22C55E'; bg='#F0FDF4';}}
else if(isSel) border='#0A0A0A';
return React.createElement('button',{key:idx,onClick:()=>pick(idx),disabled:selected!==null,style:{width:'100%',height:56,borderRadius:12,border:`1px solid ${border}`,background:bg,textAlign:'left',padding:'0 20px',fontSize:15,fontWeight:500,display:'flex',alignItems:'center',justifyContent:'space-between'}}, React.createElement('span',null,opt), showResult && isCorrect && React.createElement('span',{style:{color:'#22C55E'}},'✓'), showResult && isSel && !isCorrect && React.createElement('span',{style:{color:'#EF4444'}},'✕'));
})
),
React.createElement('div',{style:{marginTop:'auto',paddingTop:40,display:'flex',justifyContent:'space-between',fontSize:12,color:'#9CA3AF'}},`Question ${qIndex+1}/3`,'60s')
),
screen==='result' && React.createElement('div',{style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center'}},
React.createElement('div',{style:{fontWeight:900,fontSize:32,marginBottom:8}},'B QUIZ'),
React.createElement('div',{style:{fontSize:84,fontWeight:800,lineHeight:1,letterSpacing:-2,marginBottom:8}},`${score}/3`),
React.createElement('p',{style:{color:'#6B7280',fontSize:15,marginBottom:32,textAlign:'center'}}, score===3?'Parfait. Ton cerveau te remercie.':score===2?'Solide. Encore un effort demain.':score===1?"C'est un début. On refait demain ?":'Pas grave, demain est un autre quiz.'),
React.createElement('div',{style:{width:'100%',display:'flex',flexDirection:'column',gap:10,marginBottom:32}},
QUESTIONS.map((q,i)=>{
const ok=answers[i]===q.correctIndex;
return React.createElement('div',{key:i,style:{width:'100%',height:44,borderRadius:12,background:'#F9FAFB',border:'1px solid #F3F4F6',padding:'0 16px',display:'flex',alignItems:'center',justifyContent:'space-between'}},
React.createElement('span',{style:{fontSize:14,fontWeight:500}},q.cat),
React.createElement('span',{style:{width:24,height:24,borderRadius:999,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:'#fff',background:ok?'#22C55E':'#EF4444'}},ok?'✓':'✕')
);
})
),
React.createElement('button',{onClick:onDownloadAndShare,disabled:generating,style:{width:'100%',height:52,borderRadius:14,background:'#0A0A0A',color:'#fff',fontWeight:600,fontSize:15,opacity:generating?0.6:1}}, generating?'Génération...':'Télécharger l’image et partager en Story'),
React.createElement('button',{onClick:()=>{localStorage.removeItem('b_quiz_last_done');setBlocked({blocked:false,hours:0});setScreen('home');},style:{marginTop:12,fontSize:13,color:'#9CA3AF',textDecoration:'underline',background:'none'}},'Rejouer (debug)'),
React.createElement('div',{style:{marginTop:'auto',paddingTop:40,fontSize:48,opacity:0.3}},'🧠'),
React.createElement('canvas',{ref:canvasRef,className:'canvas-hide',width:1080,height:1920})
),
screen==='preview' && React.createElement('div',{style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center'}},
React.createElement('h3',{style:{fontSize:18,fontWeight:600,marginBottom:8}},'Ton image est prête'),
React.createElement('p',{style:{fontSize:13,color:'#6B7280',marginBottom:24,textAlign:'center'}},'Partage-la en story, elle est au format 1080x1920'),
dataUrl && React.createElement('div',{style:{borderRadius:16,overflow:'hidden',border:'1px solid #F3F4F6',padding:8,background:'#F9FAFB',marginBottom:24}},
React.createElement('img',{src:dataUrl,alt:'preview',style:{width:320,height:569,objectFit:'contain',background:'#fff',borderRadius:10}})
),
React.createElement('button',{onClick:shareToInsta,style:{width:'100%',height:52,borderRadius:14,background:'#7C3AED',color:'#fff',fontWeight:600,fontSize:15}},'Ouvrir ma Story →'),
React.createElement('button',{onClick:()=>{if(!dataUrl) return; const a=document.createElement('a');a.href=dataUrl;a.download=`b-quiz-${score}-sur-3.png`;document.body.appendChild(a);a.click();a.remove();},style:{width:'100%',height:52,borderRadius:14,background:'#F9FAFB',border:'1px solid #F3F4F6',color:'#0A0A0A',fontWeight:600,fontSize:15,marginTop:12}},'Re-télécharger'),
React.createElement('button',{onClick:()=>setScreen('result'),style:{marginTop:16,fontSize:13,color:'#9CA3AF',background:'none'}},'Retour'),
React.createElement('canvas',{ref:canvasRef,className:'canvas-hide',width:1080,height:1920})
)
))
);
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
