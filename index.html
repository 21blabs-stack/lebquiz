<!DOCTYPE html>
<html lang="fr">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>B QUIZ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#fff;color:#0A0A0A;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:28px 24px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#F5F0FF;color:#7C3AED;font-size:13px;font-weight:700;margin-bottom:20px}
.dot{width:8px;height:8px;border-radius:50%;background:#7C3AED;display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.4);opacity:.6}}
h1{font-size:28px;font-weight:700;line-height:1.15;margin-bottom:36px}
.btn{width:100%;height:54px;border-radius:14px;border:0;background:#0A0A0A;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.btn:disabled{background:#E5E7EB;color:#9CA3AF}
.small{font-size:12px;color:#9CA3AF;margin-top:18px}
.qtop{display:flex;justify-content:center;gap:8px;padding:16px 0 28px}
.qdot{height:6px;width:32px;border-radius:999px;background:#F3F4F6}
.qdot.active{background:#0A0A0A}
.cat{display:inline-block;padding:5px 12px;border-radius:999px;background:#F9FAFB;border:1px solid #F3F4F6;font-size:11px;font-weight:700;letter-spacing:.05em;color:#6B7280;text-transform:uppercase;margin-bottom:14px}
.q{font-size:22px;font-weight:700;line-height:1.25;margin-bottom:26px;min-height:56px}
.opt{width:100%;height:56px;border-radius:12px;border:1px solid #F3F4F6;background:#fff;text-align:left;padding:0 18px;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;cursor:pointer}
.opt.sel{border-color:#0A0A0A}
.opt.ok{border-color:#22C55E;background:#F0FDF4}
.opt.bad{border-color:#EF4444;background:#FEF2F2}
.score{font-size:86px;font-weight:900;letter-spacing:-3px;line-height:1;margin:8px 0}
.row{width:100%;height:46px;border-radius:12px;background:#F9FAFB;border:1px solid #F3F4F6;padding:0 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.row b{font-size:14px}
.circle{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px}
#mycanvas{position:absolute;left:-9999px;top:-9999px}
.previewBox{width:320px;height:569px;border:1px solid #F3F4F6;border-radius:14px;overflow:hidden;background:#fff;padding:6px;margin-bottom:18px}
.previewBox img{width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<canvas id="mycanvas" width="1080" height="1920"></canvas>

<script>
const QS=[
{cat:"Monde",q:"Quel est le plus grand océan du monde ?",o:["Atlantique","Pacifique","Indien","Arctique"],c:1},
{cat:"Vie",q:"Combien de dents possède un adulte ?",o:["28","30","32","34"],c:2},
{cat:"Temps",q:"Combien de jours compte une année bissextile ?",o:["365 jours","366 jours","364 jours","360 jours"],c:1}
];
let qi=0, ans=[], sel=null, screen='home', dataUrl=null, blobData=null, generating=false;
let blocked=false, hours=0;

function checkBlocked(){
const last=localStorage.getItem('b_quiz_last_done');
if(last){
const diff=Date.now()-parseInt(last,10);
if(diff<86400000){blocked=true; hours=Math.ceil((86400000-diff)/3600000);}
}
}
checkBlocked();

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

async function genImage(){
const canvas=document.getElementById('mycanvas');
const ctx=canvas.getContext('2d');
canvas.width=1080;canvas.height=1920;
ctx.fillStyle='#fff';ctx.fillRect(0,0,1080,1920);
ctx.fillStyle='#F5F0FF';
ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(1080,0);ctx.lineTo(1080,260);ctx.bezierCurveTo(600,180,300,220,0,120);ctx.closePath();ctx.fill();
ctx.beginPath();ctx.moveTo(200,320);ctx.bezierCurveTo(520,210,820,380,910,780);ctx.bezierCurveTo(860,1020,610,1320,560,1460);ctx.bezierCurveTo(510,1210,310,610,200,320);ctx.closePath();ctx.fill();
let y=160;
ctx.fillStyle='#0A0A0A';ctx.font='900 92px Inter';ctx.textAlign='center';ctx.fillText('B QUIZ',540,y);
y+=70;
const pill='Bon pour ton Brain';
ctx.font='600 28px Inter';
const tw=ctx.measureText(pill).width;
const pw=tw+84, ph=58, px=(1080-pw)/2;
roundRect(ctx,px,y,pw,ph,99);ctx.fillStyle='#F5F0FF';ctx.fill();
ctx.fillStyle='#7C3AED';ctx.beginPath();ctx.arc(px+28,y+ph/2,8,0,Math.PI*2);ctx.fill();
ctx.textAlign='left';ctx.font='600 28px Inter';ctx.fillText(pill,px+54,y+ph/2+10);
y+=ph+90;
const sc=ans.filter((a,i)=>a===QS[i].c).length;
ctx.fillStyle='#0A0A0A';ctx.textAlign='center';ctx.font='800 320px Inter';ctx.fillText(sc+'/3',540,y+260);
y+=380;
let msg='Bien joué !'; if(sc===3)msg='Parfait !'; else if(sc===2)msg='Bien joué !'; else if(sc===1)msg='On continue ?'; else msg='À refaire demain !';
ctx.fillStyle='#6B7280';ctx.font='500 36px Inter';ctx.fillText(msg,540,y);
y+=90;
const cw=840,ch=96,cx=(1080-cw)/2,gap=18;
for(let i=0;i<QS.length;i++){
const ok=ans[i]===QS[i].c;
roundRect(ctx,cx,y,cw,ch,18);ctx.fillStyle='#F9FAFB';ctx.fill();ctx.strokeStyle='#F3F4F6';ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle='#0A0A0A';ctx.font='600 30px Inter';ctx.textAlign='left';ctx.fillText(QS[i].cat,cx+28,y+ch/2+10);
const ccx=cx+cw-36,ccy=y+ch/2;
ctx.fillStyle=ok?'#22C55E':'#EF4444';ctx.beginPath();ctx.arc(ccx,ccy,22,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='700 24px Inter';ctx.fillText(ok?'✓':'✕',ccx,ccy+8);
y+=ch+gap;
}
ctx.globalAlpha=.15;ctx.font='140px Inter';ctx.textAlign='center';ctx.fillText('🧠',540,1660);ctx.globalAlpha=1;
ctx.fillStyle='#9CA3AF';ctx.font='500 24px Inter';ctx.fillText('Bon pour ton Brain — B QUIZ',540,1850);
const b=await new Promise(r=>canvas.toBlob(bb=>r(bb),'image/png',1));
const url=canvas.toDataURL('image/png');
return {blob:b,dataUrl:url};
}

function render(){
const app=document.getElementById('app');
if(screen==='home'){
app.innerHTML=`
<div class="center">
<div style="font-weight:900;font-size:44px;letter-spacing:-1px;margin-bottom:18px">B QUIZ</div>
<div style="font-size:12px;letter-spacing:.22em;color:#6B7280;text-transform:uppercase;margin-bottom:16px">le quiz du jour</div>
<div class="badge"><span class="dot"></span>Bon pour ton Brain</div>
<h1>3 questions par jour<br>60 secondes<br>C'est tout.</h1>
${blocked?`<div style="width:100%;background:#F9FAFB;border:1px solid #F3F4F6;border-radius:14px;padding:14px;margin-bottom:14px"><div style="font-size:14px;color:#6B7280">Tu as déjà joué aujourd'hui</div><div style="font-weight:700;margin-top:4px">Reviens dans ${hours}h</div></div><button class="btn" disabled>Bloqué 24h</button>`:`<button class="btn" id="start">Commencer le quiz</button>`}
<div class="small">100% autonome · Sans pub · Vanilla</div>
</div>`;
if(!blocked)document.getElementById('start').onclick=()=>{ans=[];qi=0;sel=null;screen='quiz';render();};
}
else if(screen==='quiz'){
const q=QS[qi];
app.innerHTML=`
<div style="flex:1;display:flex;flex-direction:column">
<div class="qtop">${QS.map((_,i)=>`<div class="qdot ${i<=qi?'active':''}"></div>`).join('')}</div>
<div class="cat">${q.cat}</div>
<div class="q">${q.q}</div>
<div id="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span>${o}</span><span class="mark"></span></button>`).join('')}</div>
<div style="margin-top:auto;padding-top:40px;display:flex;justify-content:space-between;font-size:12px;color:#9CA3AF"><span>Question ${qi+1}/3</span><span>60s</span></div>
</div>`;
document.querySelectorAll('.opt').forEach(b=>{
b.onclick=()=>{
if(sel!==null)return;
sel=parseInt(b.dataset.i);
const correct=q.c;
document.querySelectorAll('.opt').forEach((bb,idx)=>{
bb.disabled=true;
if(idx===correct){bb.classList.add('ok'); bb.querySelector('.mark').textContent='✓'; bb.querySelector('.mark').style.color='#22C55E';}
if(idx===sel && idx!==correct){bb.classList.add('bad'); bb.querySelector('.mark').textContent='✕'; bb.querySelector('.mark').style.color='#EF4444';}
if(idx===sel)bb.classList.add('sel');
});
const newAns=[...ans]; newAns[qi]=sel;
setTimeout(()=>{
ans=newAns;
if(qi<QS.length-1){qi++;sel=null;render();}
else{localStorage.setItem('b_quiz_last_done',Date.now().toString());screen='result';sel=null;render();}
},380);
};
});
}
else if(screen==='result'){
const sc=ans.filter((a,i)=>a===QS[i].c).length;
let txt=''; if(sc===3)txt='Parfait. Ton cerveau te remercie.'; else if(sc===2)txt='Solide. Encore un effort demain.'; else if(sc===1)txt="C'est un début. On refait demain ?"; else txt="Pas grave, demain est un autre quiz.";
app.innerHTML=`
<div style="flex:1;display:flex;flex-direction:column;align-items:center">
<div style="font-weight:900;font-size:32px;margin-bottom:10px">B QUIZ</div>
<div class="score">${sc}/3</div>
<div style="color:#6B7280;font-size:15px;margin-bottom:28px;text-align:center">${txt}</div>
<div style="width:100%;display:flex;flex-direction:column;margin-bottom:28px">
${QS.map((qq,i)=>{const ok=ans[i]===qq.c; return `<div class="row"><b>${qq.cat}</b><div class="circle" style="background:${ok?'#22C55E':'#EF4444'}">${ok?'✓':'✕'}</div></div>`}).join('')}
</div>
<button class="btn" id="dl">${generating?'Génération...':'Télécharger l’image et partager en Story'}</button>
<button style="margin-top:12px;background:none;border:0;font-size:13px;color:#9CA3AF;text-decoration:underline;cursor:pointer" id="replay">Rejouer (debug)</button>
<div style="margin-top:auto;padding-top:40px;font-size:48px;opacity:.3">🧠</div>
</div>`;
document.getElementById('dl').onclick=async()=>{
if(generating)return;
generating=true; render();
try{
const {blob,dataUrl:u}=await genImage();
blobData=blob; dataUrl=u;
const file=new File([blob],`b-quiz-${sc}-sur-3.png`,{type:'image/png'});
if(navigator.canShare && navigator.canShare({files:[file]})){
try{await navigator.share({files:[file],title:`B QUIZ ${sc}/3`,text:`J'ai fait ${sc}/3 au B QUIZ !`}); screen='preview'; generating=false; render(); return;}catch(e){ if(e.name==='AbortError'){screen='preview'; generating=false; render(); return;}}
}
const a=document.createElement('a'); a.href=u; a.download=`b-quiz-${sc}-sur-3.png`; document.body.appendChild(a); a.click(); a.remove();
screen='preview'; generating=false; render();
}catch(e){alert('Erreur: '+e.message); generating=false; render();}
};
document.getElementById('replay').onclick=()=>{localStorage.removeItem('b_quiz_last_done'); blocked=false; hours=0; ans=[]; qi=0; screen='home'; render();};
}
else if(screen==='preview'){
app.innerHTML=`
<div style="flex:1;display:flex;flex-direction:column;align-items:center">
<div style="font-weight:700;font-size:18px;margin-bottom:6px">Ton image est prête</div>
<div style="font-size:13px;color:#6B7280;margin-bottom:18px;text-align:center">1080x1920 avec B QUIZ en haut</div>
<div class="previewBox"><img src="${dataUrl}" /></div>
<button class="btn" style="background:#7C3AED" id="openStory">Ouvrir ma Story →</button>
<button class="btn" style="background:#F9FAFB;color:#0A0A0A;border:1px solid #F3F4F6;margin-top:12px" id="redl">Re-télécharger</button>
<button style="margin-top:14px;background:none;border:0;color:#9CA3AF;font-size:13px;cursor:pointer" id="back">Retour</button>
</div>`;
document.getElementById('openStory').onclick=async()=>{
if(blobData && navigator.canShare){
try{
const file=new File([blobData],`b-quiz.png`,{type:'image/png'});
if(navigator.canShare({files:[file]})){await navigator.share({files:[file]}); return;}
}catch(e){}
}
window.location.href='instagram://story-camera';
setTimeout(()=>{if(document.visibilityState==='visible') window.open('https://www.instagram.com/','_blank');},800);
};
document.getElementById('redl').onclick=()=>{const a=document.createElement('a');a.href=dataUrl;a.download='b-quiz.png';document.body.appendChild(a);a.click();a.remove();};
document.getElementById('back').onclick=()=>{screen='result';render();};
}
}
render();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
